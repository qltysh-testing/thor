name: Run tests
on: [push, pull_request]
permissions:
  contents: read
  id-token: write # Required for Qlty coverage uploads via OIDC

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0', 'head']
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler: ${{ (matrix.ruby < '3' && '2.4.21') || 'latest' }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - run: bundle exec thor spec
    - name: Upload coverage to Qlty
      if: matrix.ruby == '3.4' && !github.event.pull_request.head.repo.fork
      uses: qltysh/qlty-action/coverage@v2
      with:
        oidc: true
        files: coverage/.resultset.json
